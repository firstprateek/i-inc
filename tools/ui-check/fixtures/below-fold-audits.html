<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 400px; height: 300px; font: 16px Arial, sans-serif; }
  .scrollport { width: 300px; height: 120px; overflow-y: auto; }
  .content { position: relative; height: 500px; }
  .overflow, .low-contrast { position: absolute; left: 8px; }
  .overflow { top: 230px; width: 80px; height: 24px; overflow: hidden; white-space: nowrap; }
  .low-contrast { top: 270px; color: #aaa; }
</style>
<div class="scrollport">
  <div class="content">
    <div class="overflow">This below-fold text is wider than its box</div>
    <div class="low-contrast">Below-fold low contrast</div>
  </div>
</div>
